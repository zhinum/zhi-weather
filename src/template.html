<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STARTER</title>
  </head>
  <body>
    <main id="page-container">
      <form id="location-form">
        <label for="location">What is your current location?</label>
        <input
          type="text"
          id="location"
          placeholder="enter your location"
          required
        />
        <button type="submit" id="locationBtn">Get Weather</button>
      </form>
      <section id="result">
        <div id="weatherDisplay" class="hidden">
          <div id="condition"></div>
          <div id="temparature"></div>
        </div>

        <div id="displayMessage" class="hidden"></div>
      </section>
    </main>
  </body>
</html>
